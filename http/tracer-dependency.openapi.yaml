openapi: 3.1.0
info:
  title: tracer-dependency
  version: 0.1.0
  description: >-
    에이전트 서비스가 추적 API에 요구하는 부분집합이다. 추적 API의 전체 표면이 아니라
    에이전트가 없으면 실행할 수 없는 창구만 적는다. 응답은 모두 성공 봉투나 오류 봉투로 오며
    에이전트는 400 미만을 성공으로 보고 봉투를 벗겨 읽는다.
    레시피와 정리 제안의 원장은 에이전트가 소유하므로 그 창구는 여기 없고
    http/agent-api.openapi.yaml 이 갖는다.

servers:
  - url: /

tags:
  - name: tool
    description: 대화 에이전트의 도구가 읽거나 부르는 표면

paths:
  /api/v1/tasks:
    get:
      operationId: search_tasks
      tags: [tool]
      summary: 태스크를 조건으로 조회하며 식별자 목록을 실으면 그 집합만 낸다
      description: >-
        ids 를 실으면 그 식별자 집합에 드는 태스크만 낸다. 값은 쉼표로 나눈 목록이며 1 개 이상
        100 개 이하다. 이 상한은 목록 한 장이 담는 최대 개수와 같으므로 집합 전체가 한 번에
        들어온다. 그래서 ids 를 실은 요청은 cursor 와 limit 을 보지 않고 nextCursor 를
        null 로 낸다. 상한을 넘거나 값이 비면 validation_error 로 거절한다.
        찾지 못한 식별자와 남의 태스크와 숨긴 태스크는 items 에서 빠지며 그것이 조회 실패는
        아니다. 같은 식별자를 여러 번 실어도 items 에는 한 번만 실린다. 다른 조건을 함께
        실으면 그 조건도 같이 걸린다.
      x-confirmation-gate: none
      parameters:
        - name: ids
          in: query
          required: false
          schema: { type: string }
        - name: status
          in: query
          required: false
          schema: { type: string }
        - name: origin
          in: query
          required: false
          schema: { type: string }
        - name: archived
          in: query
          required: false
          schema: { type: string }
        - name: root
          in: query
          required: false
          schema: { type: string }
        - name: parentTaskId
          in: query
          required: false
          schema: { type: string }
        - name: cursor
          in: query
          required: false
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: string }
      responses:
        "2XX":
          $ref: "#/components/responses/Success"
        "400":
          $ref: "#/components/responses/InvalidTaskIds"
        "4XX":
          $ref: "#/components/responses/Failure"
        "5XX":
          $ref: "#/components/responses/Failure"

  /api/v1/tasks/{taskId}:
    get:
      operationId: get_task
      tags: [tool]
      summary: 태스크 하나를 조회한다
      x-confirmation-gate: none
      parameters:
        - name: taskId
          in: path
          required: true
          schema: { type: string }
      responses:
        "2XX":
          $ref: "#/components/responses/Success"
        "4XX":
          $ref: "#/components/responses/Failure"
        "5XX":
          $ref: "#/components/responses/Failure"
    patch:
      operationId: update_task
      tags: [tool]
      summary: 태스크의 제목과 상태를 고친다
      x-confirmation-gate: confirm
      parameters:
        - name: taskId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: {}
                status: {}
      responses:
        "2XX":
          $ref: "#/components/responses/Success"
        "4XX":
          $ref: "#/components/responses/Failure"
        "5XX":
          $ref: "#/components/responses/Failure"
    delete:
      operationId: delete_task
      tags: [tool]
      summary: 태스크를 삭제한다
      x-confirmation-gate: confirm
      parameters:
        - name: taskId
          in: path
          required: true
          schema: { type: string }
      responses:
        "2XX":
          $ref: "#/components/responses/Success"
        "4XX":
          $ref: "#/components/responses/Failure"
        "5XX":
          $ref: "#/components/responses/Failure"

  /api/v1/tasks/search:
    get:
      operationId: search_tasks_by_text
      tags: [tool]
      summary: 태스크를 본문 유사도로 검색한다
      x-confirmation-gate: none
      parameters:
        - name: q
          in: query
          required: false
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: string }
      responses:
        "2XX":
          $ref: "#/components/responses/Success"
        "4XX":
          $ref: "#/components/responses/Failure"
        "5XX":
          $ref: "#/components/responses/Failure"

  /api/v1/tasks/{taskId}/children:
    get:
      operationId: list_child_tasks
      tags: [tool]
      summary: 태스크의 자식 태스크를 조회한다
      x-confirmation-gate: none
      parameters:
        - name: taskId
          in: path
          required: true
          schema: { type: string }
      responses:
        "2XX":
          $ref: "#/components/responses/Success"
        "4XX":
          $ref: "#/components/responses/Failure"
        "5XX":
          $ref: "#/components/responses/Failure"

  /api/v1/tasks/{taskId}/turns:
    get:
      operationId: list_task_turns
      tags: [tool]
      summary: 태스크의 대화 턴을 순서대로 조회한다
      x-confirmation-gate: none
      parameters:
        - name: taskId
          in: path
          required: true
          schema: { type: string }
      responses:
        "2XX":
          $ref: "#/components/responses/Success"
        "4XX":
          $ref: "#/components/responses/Failure"
        "5XX":
          $ref: "#/components/responses/Failure"

  /api/v1/tasks/{taskId}/timeline:
    get:
      operationId: get_timeline
      tags: [tool]
      summary: 태스크의 타임라인을 조회한다
      x-confirmation-gate: none
      parameters:
        - name: taskId
          in: path
          required: true
          schema: { type: string }
        - name: cursor
          in: query
          required: false
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: string }
        - name: order
          in: query
          required: false
          description: 이른 이벤트부터 읽으면 asc, 늦은 이벤트부터 읽으면 desc다
          schema: { type: string, enum: [asc, desc] }
      responses:
        "2XX":
          $ref: "#/components/responses/Success"
        "4XX":
          $ref: "#/components/responses/Failure"
        "5XX":
          $ref: "#/components/responses/Failure"

  /api/v1/events/{eventId}:
    get:
      operationId: get_event
      tags: [tool]
      summary: 이벤트 하나를 조회한다
      description: 근거로 지목된 이벤트가 이 사용자의 것인지와 어느 종류인지를 가리는 자리이며 남의 것은 404다
      x-confirmation-gate: none
      parameters:
        - name: eventId
          in: path
          required: true
          schema: { type: string }
      responses:
        "2XX":
          $ref: "#/components/responses/Success"
        "4XX":
          $ref: "#/components/responses/Failure"
        "5XX":
          $ref: "#/components/responses/Failure"

  /api/v1/events/search:
    get:
      operationId: search_events
      tags: [tool]
      summary: 이벤트를 검색한다
      x-confirmation-gate: none
      parameters:
        - name: q
          in: query
          required: false
          schema: { type: string }
        - name: taskId
          in: query
          required: false
          schema: { type: string }
        - name: kind
          in: query
          required: false
          schema: { type: string }
        - name: lane
          in: query
          required: false
          schema: { type: string }
        - name: from
          in: query
          required: false
          schema: { type: string }
        - name: to
          in: query
          required: false
          schema: { type: string }
        - name: toolName
          in: query
          required: false
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: string }
        - name: offset
          in: query
          required: false
          description: 앞에서 건너뛸 적중 수이며 같은 조건을 여러 장으로 나눠 읽을 때 쓴다
          schema: { type: string }
      responses:
        "2XX":
          $ref: "#/components/responses/Success"
        "4XX":
          $ref: "#/components/responses/Failure"
        "5XX":
          $ref: "#/components/responses/Failure"

  /api/v1/memos:
    get:
      operationId: list_memos
      tags: [tool]
      summary: 메모를 조회한다
      x-confirmation-gate: none
      parameters:
        - name: taskId
          in: query
          required: false
          schema: { type: string }
        - name: eventId
          in: query
          required: false
          schema: { type: string }
      responses:
        "2XX":
          $ref: "#/components/responses/Success"
        "4XX":
          $ref: "#/components/responses/Failure"
        "5XX":
          $ref: "#/components/responses/Failure"
    post:
      operationId: create_memo
      tags: [tool]
      summary: 메모를 만든다
      x-confirmation-gate: confirm
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                taskId: {}
                body: {}
                eventId: {}
                author: { const: agent }
      responses:
        "2XX":
          $ref: "#/components/responses/Success"
        "4XX":
          $ref: "#/components/responses/Failure"
        "5XX":
          $ref: "#/components/responses/Failure"

  /api/v1/rules:
    get:
      operationId: list_rules
      tags: [tool]
      summary: 검증 규칙을 조회한다
      x-confirmation-gate: none
      parameters:
        - name: taskId
          in: query
          required: false
          schema: { type: string }
        - name: all
          in: query
          required: false
          schema: { type: string }
      responses:
        "2XX":
          $ref: "#/components/responses/Success"
        "4XX":
          $ref: "#/components/responses/Failure"
        "5XX":
          $ref: "#/components/responses/Failure"
    post:
      operationId: create_rule
      tags: [tool]
      summary: 검증 규칙을 만든다
      x-confirmation-gate: confirm
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                taskId: {}
                anchorEventId: {}
                name: {}
                expect: {}
                severity: {}
                rationale: {}
      responses:
        "2XX":
          $ref: "#/components/responses/Success"
        "4XX":
          $ref: "#/components/responses/Failure"
        "5XX":
          $ref: "#/components/responses/Failure"

  /api/v1/rules/{ruleId}/evidence:
    get:
      operationId: get_rule_evidence
      tags: [tool]
      summary: 규칙의 근거를 조회한다
      x-confirmation-gate: none
      parameters:
        - name: ruleId
          in: path
          required: true
          schema: { type: string }
        - name: taskId
          in: query
          required: false
          schema: { type: string }
      responses:
        "2XX":
          $ref: "#/components/responses/Success"
        "4XX":
          $ref: "#/components/responses/Failure"
        "5XX":
          $ref: "#/components/responses/Failure"

  /api/v1/tags:
    get:
      operationId: list_tags
      tags: [tool]
      summary: 태그를 조회한다
      x-confirmation-gate: none
      responses:
        "2XX":
          $ref: "#/components/responses/Success"
        "4XX":
          $ref: "#/components/responses/Failure"
        "5XX":
          $ref: "#/components/responses/Failure"
    post:
      operationId: create_tag
      tags: [tool]
      summary: 태그를 만든다
      x-confirmation-gate: confirm
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: {}
                color: {}
                description: {}
      responses:
        "2XX":
          $ref: "#/components/responses/Success"
        "4XX":
          $ref: "#/components/responses/Failure"
        "5XX":
          $ref: "#/components/responses/Failure"
  /api/v1/tasks/{taskId}/archive:
    post:
      operationId: archive_task
      tags: [tool]
      summary: 태스크를 보관하며 조건을 실으면 그 조건에서만 보관한다
      description: >-
        보관은 멱등이며 이미 보관된 태스크를 다시 보관해도 성공이다. ifNoActivitySince 를 실으면
        추적이 자기 원장의 마지막 사건 시각과 그 값을 비교해, 실은 시각보다 뒤에 도착한 사건이
        하나라도 있으면 보관하지 않고 cleanup.stale 로 거절한다. 마지막 사건 시각이 실은 값과
        같으면 새 활동이 아니므로 보관한다. 마지막 사건이 아예 없는 태스크는 어느 값을 실어도
        새 활동이 없는 것이며, 조건을 null 로 실으면 사건이 하나라도 있는 태스크는 새 활동으로
        본다. 조건을 싣지 않으면 마지막 사건을 보지 않고 보관한다.
      x-confirmation-gate: confirm
      parameters:
        - name: taskId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskArchiveBody"
      responses:
        "2XX":
          $ref: "#/components/responses/Success"
        "409":
          $ref: "#/components/responses/CleanupStale"
        "4XX":
          $ref: "#/components/responses/Failure"
        "5XX":
          $ref: "#/components/responses/Failure"
    delete:
      operationId: unarchive_task
      tags: [tool]
      summary: 태스크의 보관을 푼다
      x-confirmation-gate: confirm
      parameters:
        - name: taskId
          in: path
          required: true
          schema: { type: string }
      responses:
        "2XX":
          $ref: "#/components/responses/Success"
        "4XX":
          $ref: "#/components/responses/Failure"
        "5XX":
          $ref: "#/components/responses/Failure"

  /api/v1/memos/{memoId}:
    patch:
      operationId: update_memo
      tags: [tool]
      summary: 메모를 고친다
      x-confirmation-gate: confirm
      parameters:
        - name: memoId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                body: {}
      responses:
        "2XX":
          $ref: "#/components/responses/Success"
        "4XX":
          $ref: "#/components/responses/Failure"
        "5XX":
          $ref: "#/components/responses/Failure"
    delete:
      operationId: delete_memo
      tags: [tool]
      summary: 메모를 삭제한다
      x-confirmation-gate: confirm
      parameters:
        - name: memoId
          in: path
          required: true
          schema: { type: string }
      responses:
        "2XX":
          $ref: "#/components/responses/Success"
        "4XX":
          $ref: "#/components/responses/Failure"
        "5XX":
          $ref: "#/components/responses/Failure"

  /api/v1/rules/{ruleId}:
    patch:
      operationId: update_rule
      tags: [tool]
      summary: 검증 규칙을 고친다
      x-confirmation-gate: confirm
      parameters:
        - name: ruleId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: {}
                expect: {}
                severity: {}
                rationale: {}
      responses:
        "2XX":
          $ref: "#/components/responses/Success"
        "4XX":
          $ref: "#/components/responses/Failure"
        "5XX":
          $ref: "#/components/responses/Failure"
    delete:
      operationId: delete_rule
      tags: [tool]
      summary: 검증 규칙을 삭제한다
      x-confirmation-gate: confirm
      parameters:
        - name: ruleId
          in: path
          required: true
          schema: { type: string }
      responses:
        "2XX":
          $ref: "#/components/responses/Success"
        "4XX":
          $ref: "#/components/responses/Failure"
        "5XX":
          $ref: "#/components/responses/Failure"

  /api/v1/rules/{ruleId}/approve:
    post:
      operationId: approve_rule
      tags: [tool]
      summary: 검증 규칙을 승인한다
      x-confirmation-gate: confirm
      parameters:
        - name: ruleId
          in: path
          required: true
          schema: { type: string }
      responses:
        "2XX":
          $ref: "#/components/responses/Success"
        "4XX":
          $ref: "#/components/responses/Failure"
        "5XX":
          $ref: "#/components/responses/Failure"

  /api/v1/rules/{ruleId}/reevaluate:
    post:
      operationId: reevaluate_rule
      tags: [tool]
      summary: 검증 규칙을 다시 평가한다
      x-confirmation-gate: confirm
      parameters:
        - name: ruleId
          in: path
          required: true
          schema: { type: string }
      responses:
        "2XX":
          $ref: "#/components/responses/Success"
        "4XX":
          $ref: "#/components/responses/Failure"
        "5XX":
          $ref: "#/components/responses/Failure"

  /api/v1/tags/{tagId}:
    patch:
      operationId: update_tag
      tags: [tool]
      summary: 태그를 고친다
      x-confirmation-gate: confirm
      parameters:
        - name: tagId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: {}
                color: {}
                description: {}
      responses:
        "2XX":
          $ref: "#/components/responses/Success"
        "4XX":
          $ref: "#/components/responses/Failure"
        "5XX":
          $ref: "#/components/responses/Failure"
    delete:
      operationId: delete_tag
      tags: [tool]
      summary: 태그를 삭제한다
      x-confirmation-gate: confirm
      parameters:
        - name: tagId
          in: path
          required: true
          schema: { type: string }
      responses:
        "2XX":
          $ref: "#/components/responses/Success"
        "4XX":
          $ref: "#/components/responses/Failure"
        "5XX":
          $ref: "#/components/responses/Failure"

  /api/v1/task-tags:
    put:
      operationId: set_task_tags
      tags: [tool]
      summary: 태스크의 태그를 통째로 지정한다
      x-confirmation-gate: confirm
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                taskId: {}
                tagIds: {}
      responses:
        "2XX":
          $ref: "#/components/responses/Success"
        "4XX":
          $ref: "#/components/responses/Failure"
        "5XX":
          $ref: "#/components/responses/Failure"
components:
  responses:
    Success:
      description: 성공 봉투를 낸다
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SuccessEnvelope"
    Failure:
      description: 오류 봉투를 낸다
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    InvalidTaskIds:
      description: >-
        실은 식별자 목록이 제약을 만족하지 않는다. 값이 비었거나 상한을 넘은 요청이 여기 든다.
        추적은 스키마를 만족하지 않는 질의를 모두 같은 코드로 거절하므로 이 거절도 그 코드다.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            ok: false
            error:
              code: validation_error
              message: Invalid request

    CleanupStale:
      description: >-
        실은 조건이 깨졌다. 그 태스크에 조건의 시각보다 뒤에 도착한 사건이 있으므로 보관하지
        않았다. 부른 쪽은 이 거절을 받고 자기 원장에 적은 수용을 되돌린다.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            ok: false
            error:
              code: cleanup.stale
              message: Task has activity since the suggestion observed it

  schemas:
    SuccessEnvelope:
      type: object
      required: [ok, data]
      properties:
        ok:
          type: boolean
          const: true
        data:
          description: 창구가 낸 payload이며 실을 것이 없으면 null이다

    ErrorEnvelope:
      type: object
      required: [ok, error]
      properties:
        ok:
          type: boolean
          const: false
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            details:
              description: 구조화된 거절 근거이며 주어졌을 때만 실린다

    Timestamp:
      type: string
      format: date-time

    TaskArchiveBody:
      type: object
      description: 보관을 거는 조건이며 본문을 통째로 생략하면 조건 없이 보관한다
      additionalProperties: false
      properties:
        ifNoActivitySince:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
          description: >-
            부르는 쪽이 그 태스크에서 본 마지막 사건의 시각이다. 추적은 이 시각보다 뒤에 도착한
            사건이 있으면 보관하지 않는다.
