openapi: 3.1.0
info:
  title: tracer-dependency
  version: 0.1.0
  description: >-
    에이전트 서비스가 추적 API에 요구하는 부분집합이다. 추적 API의 전체 표면이 아니라
    에이전트가 없으면 실행할 수 없는 창구만 적는다. 응답은 모두 성공 봉투나 오류 봉투로 오며
    에이전트는 400 미만을 성공으로 보고 봉투를 벗겨 읽는다.

servers:
  - url: /

tags:
  - name: tool
    description: 대화 에이전트의 도구가 읽거나 부르는 표면
  - name: output
    description: 산출물을 만드는 표면이며 대시보드도 같은 본문으로 부른다

paths:
  /api/v1/tasks:
    get:
      operationId: search_tasks
      tags: [tool]
      summary: 태스크를 조건으로 조회한다
      x-confirmation-gate: none
      parameters:
        - name: status
          in: query
          required: false
          schema: { type: string }
        - name: origin
          in: query
          required: false
          schema: { type: string }
        - name: archived
          in: query
          required: false
          schema: { type: string }
        - name: root
          in: query
          required: false
          schema: { type: string }
        - name: parentTaskId
          in: query
          required: false
          schema: { type: string }
        - name: cursor
          in: query
          required: false
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: string }
      responses:
        "2XX":
          $ref: "#/components/responses/Success"
        "4XX":
          $ref: "#/components/responses/Failure"
        "5XX":
          $ref: "#/components/responses/Failure"

  /api/v1/tasks/{taskId}:
    get:
      operationId: get_task
      tags: [tool]
      summary: 태스크 하나를 조회한다
      x-confirmation-gate: none
      parameters:
        - name: taskId
          in: path
          required: true
          schema: { type: string }
      responses:
        "2XX":
          $ref: "#/components/responses/Success"
        "4XX":
          $ref: "#/components/responses/Failure"
        "5XX":
          $ref: "#/components/responses/Failure"
    patch:
      operationId: update_task
      tags: [tool]
      summary: 태스크의 제목과 상태를 고친다
      x-confirmation-gate: confirm
      parameters:
        - name: taskId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: {}
                status: {}
      responses:
        "2XX":
          $ref: "#/components/responses/Success"
        "4XX":
          $ref: "#/components/responses/Failure"
        "5XX":
          $ref: "#/components/responses/Failure"
    delete:
      operationId: delete_task
      tags: [tool]
      summary: 태스크를 삭제한다
      x-confirmation-gate: confirm
      parameters:
        - name: taskId
          in: path
          required: true
          schema: { type: string }
      responses:
        "2XX":
          $ref: "#/components/responses/Success"
        "4XX":
          $ref: "#/components/responses/Failure"
        "5XX":
          $ref: "#/components/responses/Failure"

  /api/v1/tasks/search:
    get:
      operationId: search_tasks_by_text
      tags: [tool]
      summary: 태스크를 본문 유사도로 검색한다
      x-confirmation-gate: none
      parameters:
        - name: q
          in: query
          required: false
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: string }
      responses:
        "2XX":
          $ref: "#/components/responses/Success"
        "4XX":
          $ref: "#/components/responses/Failure"
        "5XX":
          $ref: "#/components/responses/Failure"

  /api/v1/tasks/{taskId}/children:
    get:
      operationId: list_child_tasks
      tags: [tool]
      summary: 태스크의 자식 태스크를 조회한다
      x-confirmation-gate: none
      parameters:
        - name: taskId
          in: path
          required: true
          schema: { type: string }
      responses:
        "2XX":
          $ref: "#/components/responses/Success"
        "4XX":
          $ref: "#/components/responses/Failure"
        "5XX":
          $ref: "#/components/responses/Failure"

  /api/v1/tasks/{taskId}/turns:
    get:
      operationId: list_task_turns
      tags: [tool]
      summary: 태스크의 대화 턴을 순서대로 조회한다
      x-confirmation-gate: none
      parameters:
        - name: taskId
          in: path
          required: true
          schema: { type: string }
      responses:
        "2XX":
          $ref: "#/components/responses/Success"
        "4XX":
          $ref: "#/components/responses/Failure"
        "5XX":
          $ref: "#/components/responses/Failure"

  /api/v1/tasks/{taskId}/timeline:
    get:
      operationId: get_timeline
      tags: [tool]
      summary: 태스크의 타임라인을 조회한다
      x-confirmation-gate: none
      parameters:
        - name: taskId
          in: path
          required: true
          schema: { type: string }
        - name: cursor
          in: query
          required: false
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: string }
        - name: order
          in: query
          required: false
          description: 이른 이벤트부터 읽으면 asc, 늦은 이벤트부터 읽으면 desc다
          schema: { type: string, enum: [asc, desc] }
      responses:
        "2XX":
          $ref: "#/components/responses/Success"
        "4XX":
          $ref: "#/components/responses/Failure"
        "5XX":
          $ref: "#/components/responses/Failure"

  /api/v1/events/search:
    get:
      operationId: search_events
      tags: [tool]
      summary: 이벤트를 검색한다
      x-confirmation-gate: none
      parameters:
        - name: q
          in: query
          required: false
          schema: { type: string }
        - name: taskId
          in: query
          required: false
          schema: { type: string }
        - name: kind
          in: query
          required: false
          schema: { type: string }
        - name: lane
          in: query
          required: false
          schema: { type: string }
        - name: from
          in: query
          required: false
          schema: { type: string }
        - name: to
          in: query
          required: false
          schema: { type: string }
        - name: toolName
          in: query
          required: false
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: string }
        - name: offset
          in: query
          required: false
          description: 앞에서 건너뛸 적중 수이며 같은 조건을 여러 장으로 나눠 읽을 때 쓴다
          schema: { type: string }
      responses:
        "2XX":
          $ref: "#/components/responses/Success"
        "4XX":
          $ref: "#/components/responses/Failure"
        "5XX":
          $ref: "#/components/responses/Failure"

  /api/v1/memos:
    get:
      operationId: list_memos
      tags: [tool]
      summary: 메모를 조회한다
      x-confirmation-gate: none
      parameters:
        - name: taskId
          in: query
          required: false
          schema: { type: string }
        - name: eventId
          in: query
          required: false
          schema: { type: string }
      responses:
        "2XX":
          $ref: "#/components/responses/Success"
        "4XX":
          $ref: "#/components/responses/Failure"
        "5XX":
          $ref: "#/components/responses/Failure"
    post:
      operationId: create_memo
      tags: [tool]
      summary: 메모를 만든다
      x-confirmation-gate: confirm
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                taskId: {}
                body: {}
                eventId: {}
                author: { const: agent }
      responses:
        "2XX":
          $ref: "#/components/responses/Success"
        "4XX":
          $ref: "#/components/responses/Failure"
        "5XX":
          $ref: "#/components/responses/Failure"

  /api/v1/rules:
    get:
      operationId: list_rules
      tags: [tool]
      summary: 검증 규칙을 조회한다
      x-confirmation-gate: none
      parameters:
        - name: taskId
          in: query
          required: false
          schema: { type: string }
        - name: all
          in: query
          required: false
          schema: { type: string }
      responses:
        "2XX":
          $ref: "#/components/responses/Success"
        "4XX":
          $ref: "#/components/responses/Failure"
        "5XX":
          $ref: "#/components/responses/Failure"
    post:
      operationId: create_rule
      tags: [tool]
      summary: 검증 규칙을 만든다
      x-confirmation-gate: confirm
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                taskId: {}
                anchorEventId: {}
                name: {}
                expect: {}
                severity: {}
                rationale: {}
      responses:
        "2XX":
          $ref: "#/components/responses/Success"
        "4XX":
          $ref: "#/components/responses/Failure"
        "5XX":
          $ref: "#/components/responses/Failure"

  /api/v1/rules/{ruleId}/evidence:
    get:
      operationId: get_rule_evidence
      tags: [tool]
      summary: 규칙의 근거를 조회한다
      x-confirmation-gate: none
      parameters:
        - name: ruleId
          in: path
          required: true
          schema: { type: string }
        - name: taskId
          in: query
          required: false
          schema: { type: string }
      responses:
        "2XX":
          $ref: "#/components/responses/Success"
        "4XX":
          $ref: "#/components/responses/Failure"
        "5XX":
          $ref: "#/components/responses/Failure"

  /api/v1/tags:
    get:
      operationId: list_tags
      tags: [tool]
      summary: 태그를 조회한다
      x-confirmation-gate: none
      responses:
        "2XX":
          $ref: "#/components/responses/Success"
        "4XX":
          $ref: "#/components/responses/Failure"
        "5XX":
          $ref: "#/components/responses/Failure"
    post:
      operationId: create_tag
      tags: [tool]
      summary: 태그를 만든다
      x-confirmation-gate: confirm
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: {}
                color: {}
                description: {}
      responses:
        "2XX":
          $ref: "#/components/responses/Success"
        "4XX":
          $ref: "#/components/responses/Failure"
        "5XX":
          $ref: "#/components/responses/Failure"

  /api/v1/recipes:
    get:
      operationId: list_recipes
      tags: [tool]
      summary: 레시피를 조회한다
      x-confirmation-gate: none
      parameters:
        - name: status
          in: query
          required: false
          schema: { type: string }
      responses:
        "2XX":
          $ref: "#/components/responses/Success"
        "4XX":
          $ref: "#/components/responses/Failure"
        "5XX":
          $ref: "#/components/responses/Failure"
    post:
      operationId: create_recipes
      tags: [output]
      summary: 레시피 후보를 한 벌로 만든다
      description: >-
        한 호출이 후보 전부와 그 색인 적재를 한 트랜잭션으로 쓴다. 부분만 남는 상태가 없으므로
        부르는 쪽은 성공과 실패 둘만 본다. sourceJobId를 실으면 그 값으로 이미 만들어진 후보가
        있는지 먼저 보고, 있으면 아무것도 쓰지 않고 그것을 낸다.
      x-confirmation-gate: confirm
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecipeCreateBody"
      responses:
        "201":
          description: 후보를 만들었다
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: "#/components/schemas/RecipeList"
        "200":
          description: 같은 sourceJobId로 이미 만들어진 후보를 그대로 낸다
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: "#/components/schemas/RecipeList"
        "4XX":
          $ref: "#/components/responses/Failure"
        "5XX":
          $ref: "#/components/responses/Failure"

  /api/v1/recipes/search:
    get:
      operationId: search_recipes
      tags: [tool]
      summary: 레시피를 본문 유사도로 검색한다
      x-confirmation-gate: none
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: string }
      responses:
        "2XX":
          $ref: "#/components/responses/Success"
        "4XX":
          $ref: "#/components/responses/Failure"
        "5XX":
          $ref: "#/components/responses/Failure"

  /api/v1/task-cleanup/suggestions:
    get:
      operationId: list_cleanup_suggestions
      tags: [tool]
      summary: 정리 제안을 조회한다
      x-confirmation-gate: none
      parameters:
        - name: status
          in: query
          required: false
          schema: { type: string }
      responses:
        "2XX":
          $ref: "#/components/responses/Success"
        "4XX":
          $ref: "#/components/responses/Failure"
        "5XX":
          $ref: "#/components/responses/Failure"
    post:
      operationId: create_cleanup_suggestions
      tags: [output]
      summary: 정리 제안을 한 벌로 만든다
      description: >-
        한 호출이 제안 전부를 한 트랜잭션으로 쓴다. 같은 태스크와 종류에 대기 중인 제안이 이미
        있으면 그 행의 근거와 사유를 새 것으로 고치고 새 행을 만들지 않으므로, 같은 본문을 다시
        보내도 대기 행의 수가 늘지 않는다.
      x-confirmation-gate: confirm
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CleanupSuggestionCreateBody"
      responses:
        "201":
          description: 제안을 만들었거나 대기 중인 제안을 고쳤다
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: "#/components/schemas/CleanupSuggestionList"
        "4XX":
          $ref: "#/components/responses/Failure"
        "5XX":
          $ref: "#/components/responses/Failure"

  /api/v1/tasks/{taskId}/archive:
    post:
      operationId: archive_task
      tags: [tool]
      summary: 태스크를 보관한다
      x-confirmation-gate: confirm
      parameters:
        - name: taskId
          in: path
          required: true
          schema: { type: string }
      responses:
        "2XX":
          $ref: "#/components/responses/Success"
        "4XX":
          $ref: "#/components/responses/Failure"
        "5XX":
          $ref: "#/components/responses/Failure"
    delete:
      operationId: unarchive_task
      tags: [tool]
      summary: 태스크의 보관을 푼다
      x-confirmation-gate: confirm
      parameters:
        - name: taskId
          in: path
          required: true
          schema: { type: string }
      responses:
        "2XX":
          $ref: "#/components/responses/Success"
        "4XX":
          $ref: "#/components/responses/Failure"
        "5XX":
          $ref: "#/components/responses/Failure"

  /api/v1/memos/{memoId}:
    patch:
      operationId: update_memo
      tags: [tool]
      summary: 메모를 고친다
      x-confirmation-gate: confirm
      parameters:
        - name: memoId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                body: {}
      responses:
        "2XX":
          $ref: "#/components/responses/Success"
        "4XX":
          $ref: "#/components/responses/Failure"
        "5XX":
          $ref: "#/components/responses/Failure"
    delete:
      operationId: delete_memo
      tags: [tool]
      summary: 메모를 삭제한다
      x-confirmation-gate: confirm
      parameters:
        - name: memoId
          in: path
          required: true
          schema: { type: string }
      responses:
        "2XX":
          $ref: "#/components/responses/Success"
        "4XX":
          $ref: "#/components/responses/Failure"
        "5XX":
          $ref: "#/components/responses/Failure"

  /api/v1/rules/{ruleId}:
    patch:
      operationId: update_rule
      tags: [tool]
      summary: 검증 규칙을 고친다
      x-confirmation-gate: confirm
      parameters:
        - name: ruleId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: {}
                expect: {}
                severity: {}
                rationale: {}
      responses:
        "2XX":
          $ref: "#/components/responses/Success"
        "4XX":
          $ref: "#/components/responses/Failure"
        "5XX":
          $ref: "#/components/responses/Failure"
    delete:
      operationId: delete_rule
      tags: [tool]
      summary: 검증 규칙을 삭제한다
      x-confirmation-gate: confirm
      parameters:
        - name: ruleId
          in: path
          required: true
          schema: { type: string }
      responses:
        "2XX":
          $ref: "#/components/responses/Success"
        "4XX":
          $ref: "#/components/responses/Failure"
        "5XX":
          $ref: "#/components/responses/Failure"

  /api/v1/rules/{ruleId}/approve:
    post:
      operationId: approve_rule
      tags: [tool]
      summary: 검증 규칙을 승인한다
      x-confirmation-gate: confirm
      parameters:
        - name: ruleId
          in: path
          required: true
          schema: { type: string }
      responses:
        "2XX":
          $ref: "#/components/responses/Success"
        "4XX":
          $ref: "#/components/responses/Failure"
        "5XX":
          $ref: "#/components/responses/Failure"

  /api/v1/rules/{ruleId}/reevaluate:
    post:
      operationId: reevaluate_rule
      tags: [tool]
      summary: 검증 규칙을 다시 평가한다
      x-confirmation-gate: confirm
      parameters:
        - name: ruleId
          in: path
          required: true
          schema: { type: string }
      responses:
        "2XX":
          $ref: "#/components/responses/Success"
        "4XX":
          $ref: "#/components/responses/Failure"
        "5XX":
          $ref: "#/components/responses/Failure"

  /api/v1/tags/{tagId}:
    patch:
      operationId: update_tag
      tags: [tool]
      summary: 태그를 고친다
      x-confirmation-gate: confirm
      parameters:
        - name: tagId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: {}
                color: {}
                description: {}
      responses:
        "2XX":
          $ref: "#/components/responses/Success"
        "4XX":
          $ref: "#/components/responses/Failure"
        "5XX":
          $ref: "#/components/responses/Failure"
    delete:
      operationId: delete_tag
      tags: [tool]
      summary: 태그를 삭제한다
      x-confirmation-gate: confirm
      parameters:
        - name: tagId
          in: path
          required: true
          schema: { type: string }
      responses:
        "2XX":
          $ref: "#/components/responses/Success"
        "4XX":
          $ref: "#/components/responses/Failure"
        "5XX":
          $ref: "#/components/responses/Failure"

  /api/v1/task-tags:
    put:
      operationId: set_task_tags
      tags: [tool]
      summary: 태스크의 태그를 통째로 지정한다
      x-confirmation-gate: confirm
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                taskId: {}
                tagIds: {}
      responses:
        "2XX":
          $ref: "#/components/responses/Success"
        "4XX":
          $ref: "#/components/responses/Failure"
        "5XX":
          $ref: "#/components/responses/Failure"

  /api/v1/recipes/{recipeId}/accept:
    post:
      operationId: accept_recipe
      tags: [tool]
      summary: 레시피를 채택한다
      x-confirmation-gate: confirm
      parameters:
        - name: recipeId
          in: path
          required: true
          schema: { type: string }
      responses:
        "2XX":
          $ref: "#/components/responses/Success"
        "4XX":
          $ref: "#/components/responses/Failure"
        "5XX":
          $ref: "#/components/responses/Failure"

  /api/v1/recipes/{recipeId}/dismiss:
    post:
      operationId: dismiss_recipe
      tags: [tool]
      summary: 레시피를 보류한다
      x-confirmation-gate: confirm
      parameters:
        - name: recipeId
          in: path
          required: true
          schema: { type: string }
      responses:
        "2XX":
          $ref: "#/components/responses/Success"
        "4XX":
          $ref: "#/components/responses/Failure"
        "5XX":
          $ref: "#/components/responses/Failure"

  /api/v1/recipes/{recipeId}/retire:
    post:
      operationId: retire_recipe
      tags: [tool]
      summary: 레시피를 폐기한다
      x-confirmation-gate: confirm
      parameters:
        - name: recipeId
          in: path
          required: true
          schema: { type: string }
      responses:
        "2XX":
          $ref: "#/components/responses/Success"
        "4XX":
          $ref: "#/components/responses/Failure"
        "5XX":
          $ref: "#/components/responses/Failure"

  /api/v1/task-cleanup/suggestions/{suggestionId}/accept:
    post:
      operationId: accept_cleanup
      tags: [tool]
      summary: 정리 제안을 수용한다
      x-confirmation-gate: confirm
      parameters:
        - name: suggestionId
          in: path
          required: true
          schema: { type: string }
      responses:
        "2XX":
          $ref: "#/components/responses/Success"
        "4XX":
          $ref: "#/components/responses/Failure"
        "5XX":
          $ref: "#/components/responses/Failure"

  /api/v1/task-cleanup/suggestions/{suggestionId}/dismiss:
    post:
      operationId: dismiss_cleanup
      tags: [tool]
      summary: 정리 제안을 기각한다
      x-confirmation-gate: confirm
      parameters:
        - name: suggestionId
          in: path
          required: true
          schema: { type: string }
      responses:
        "2XX":
          $ref: "#/components/responses/Success"
        "4XX":
          $ref: "#/components/responses/Failure"
        "5XX":
          $ref: "#/components/responses/Failure"

components:
  responses:
    Success:
      description: 성공 봉투를 낸다
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SuccessEnvelope"
    Failure:
      description: 오류 봉투를 낸다
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"

  schemas:
    SuccessEnvelope:
      type: object
      required: [ok, data]
      properties:
        ok:
          type: boolean
          const: true
        data:
          description: 창구가 낸 payload이며 실을 것이 없으면 null이다

    ErrorEnvelope:
      type: object
      required: [ok, error]
      properties:
        ok:
          type: boolean
          const: false
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            details:
              description: 구조화된 거절 근거이며 주어졌을 때만 실린다

    Timestamp:
      type: string
      format: date-time

    Author:
      type: string
      enum: [agent, user]
      description: 이 산출물을 만든 주체이며 사람이 고친 것과 자동으로 만들어진 것을 구분한다

    RecipeStatus:
      type: string
      enum: [candidate, active, dismissed, superseded, retired]

    RecipeFileRole:
      type: string
      enum: [read, write, both]

    RecipeVerifyTool:
      type: string
      enum: [command, file-read, file-write, web]

    RecipeCorrection:
      type: object
      required: [whatAgentDid, howCorrected, evidence]
      properties:
        whatAgentDid: { type: string, minLength: 1, maxLength: 500 }
        howCorrected: { type: string, minLength: 1, maxLength: 500 }
        evidence:
          type: array
          minItems: 1
          maxItems: 50
          items: { type: string, minLength: 1 }
          description: 이 지적을 뒷받침하는 이벤트 식별자다

    RecipePitfall:
      type: object
      required: [pitfall, whyNonObvious, evidence]
      properties:
        pitfall: { type: string, minLength: 1, maxLength: 500 }
        whyNonObvious: { type: string, minLength: 1, maxLength: 500 }
        evidence:
          type: array
          minItems: 1
          maxItems: 50
          items: { type: string, minLength: 1 }

    RecipeVerify:
      oneOf:
        - type: object
          additionalProperties: false
          required: [kind, commandMatches]
          properties:
            kind: { type: string, const: command }
            commandMatches:
              type: array
              minItems: 1
              maxItems: 20
              items: { type: string, minLength: 1, maxLength: 200 }
        - type: object
          additionalProperties: false
          required: [kind, pattern]
          properties:
            kind: { type: string, const: pattern }
            pattern: { type: string, minLength: 1, maxLength: 500 }
        - type: object
          additionalProperties: false
          required: [kind, tool]
          properties:
            kind: { type: string, const: action }
            tool:
              $ref: "#/components/schemas/RecipeVerifyTool"

    RecipeStep:
      type: object
      required: [order, action]
      properties:
        order:
          type: integer
          minimum: 1
          maximum: 50
          description: 절차의 순서가 곧 의미이므로 1부터 빈칸 없이 이어진다
        action: { type: string, minLength: 1, maxLength: 200 }
        rationale:
          type: [string, "null"]
          maxLength: 300
        verify:
          oneOf:
            - $ref: "#/components/schemas/RecipeVerify"
            - type: "null"

    RecipeTouchedFile:
      type: object
      required: [path, role]
      properties:
        path: { type: string, minLength: 1 }
        role:
          $ref: "#/components/schemas/RecipeFileRole"

    RecipeSlice:
      type: object
      required: [taskId, turnIds, eventIds]
      properties:
        taskId: { type: string, minLength: 1, maxLength: 64 }
        turnIds:
          type: array
          items: { type: string, minLength: 1 }
        eventIds:
          type: array
          items: { type: string, minLength: 1 }

    RecipeDraft:
      type: object
      description: 아직 원장에 없는 레시피 하나이며 식별자와 상태와 판은 창구가 정한다
      required:
        - title
        - intent
        - description
        - summaryMd
        - request
        - contributingSlices
        - rationale
      properties:
        title: { type: string, minLength: 1, maxLength: 120 }
        intent: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, minLength: 1, maxLength: 400 }
        summaryMd: { type: string, minLength: 1, maxLength: 4000 }
        request: { type: string, minLength: 1, maxLength: 2000 }
        rationale: { type: string, minLength: 1, maxLength: 500 }
        corrections:
          type: array
          maxItems: 20
          default: []
          items:
            $ref: "#/components/schemas/RecipeCorrection"
        pitfalls:
          type: array
          maxItems: 20
          default: []
          items:
            $ref: "#/components/schemas/RecipePitfall"
        governingRules:
          type: array
          maxItems: 50
          default: []
          items: { type: string, minLength: 1 }
        steps:
          type: array
          maxItems: 20
          default: []
          items:
            $ref: "#/components/schemas/RecipeStep"
        touchedFiles:
          type: array
          maxItems: 30
          default: []
          items:
            $ref: "#/components/schemas/RecipeTouchedFile"
        contributingSlices:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: "#/components/schemas/RecipeSlice"
        language:
          type: [string, "null"]
          minLength: 1
          maxLength: 16
        parentRecipeId:
          type: [string, "null"]
          minLength: 1
          maxLength: 200
          description: 이 레시피가 고쳐 쓰는 레시피이며 그 레시피의 상태는 채택 시점에 움직인다
        parentRecipeSeenRev:
          type: integer
          minimum: 1
          description: >-
            부르는 쪽이 본 부모의 판이다. 지금 원장의 판과 다르면 부모를 잃은 채로 만들어지며
            그것이 거절 사유는 아니다.

    RecipeCreateBody:
      type: object
      required: [recipes, author]
      properties:
        recipes:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: "#/components/schemas/RecipeDraft"
        author:
          $ref: "#/components/schemas/Author"
        sourceJobId:
          type: [string, "null"]
          minLength: 1
          maxLength: 200
          description: 이 한 벌을 낸 실행의 식별자이며 같은 값으로 두 번 부르면 앞의 것을 낸다

    Recipe:
      type: object
      description: 레시피 원장 행 하나이며 조회와 생성과 상태 변경이 모두 이 모양을 낸다
      required:
        - id
        - userId
        - status
        - title
        - intent
        - description
        - summaryMd
        - request
        - corrections
        - pitfalls
        - governingRules
        - steps
        - touchedFiles
        - contributingSlices
        - rationale
        - language
        - rev
        - parentRecipeId
        - sourceJobId
        - userEdited
        - lastEditedBy
        - error
        - createdAt
        - updatedAt
        - resolvedAt
      properties:
        id: { type: string }
        userId: { type: string }
        status:
          $ref: "#/components/schemas/RecipeStatus"
        title: { type: string }
        intent: { type: string }
        description: { type: string }
        summaryMd: { type: string }
        request: { type: string }
        corrections:
          type: array
          items:
            $ref: "#/components/schemas/RecipeCorrection"
        pitfalls:
          type: array
          items:
            $ref: "#/components/schemas/RecipePitfall"
        governingRules:
          type: array
          items: { type: string }
        steps:
          type: array
          items:
            $ref: "#/components/schemas/RecipeStep"
        touchedFiles:
          type: array
          items:
            $ref: "#/components/schemas/RecipeTouchedFile"
        contributingSlices:
          type: array
          items:
            $ref: "#/components/schemas/RecipeSlice"
        rationale: { type: [string, "null"] }
        language: { type: [string, "null"] }
        rev:
          type: integer
          minimum: 1
        parentRecipeId: { type: [string, "null"] }
        sourceJobId: { type: [string, "null"] }
        userEdited: { type: boolean }
        lastEditedBy:
          $ref: "#/components/schemas/Author"
        error: { type: [string, "null"] }
        createdAt:
          $ref: "#/components/schemas/Timestamp"
        updatedAt:
          $ref: "#/components/schemas/Timestamp"
        resolvedAt:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"

    RecipeList:
      type: object
      required: [recipes]
      properties:
        recipes:
          type: array
          description: 요청에 실린 순서를 그대로 지킨다
          items:
            $ref: "#/components/schemas/Recipe"

    CleanupSuggestionKind:
      type: string
      enum: [archive]

    CleanupSuggestionStatus:
      type: string
      enum: [pending, accepted, dismissed]

    CleanupSuggestionDraft:
      type: object
      description: 아직 원장에 없는 정리 제안 하나이며 대조할 값과 관측 시각은 창구가 정한다
      required: [taskId, kind, rationale]
      properties:
        taskId: { type: string, minLength: 1, maxLength: 64 }
        kind:
          $ref: "#/components/schemas/CleanupSuggestionKind"
        rationale: { type: string, minLength: 1, maxLength: 500 }

    CleanupSuggestionCreateBody:
      type: object
      required: [suggestions]
      properties:
        suggestions:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: "#/components/schemas/CleanupSuggestionDraft"
        jobId:
          type: string
          minLength: 1
          maxLength: 200
          description: 이 한 벌을 낸 실행의 식별자이며 싣지 않으면 빈 문자열로 적힌다

    CleanupSuggestion:
      type: object
      description: 정리 제안 원장 행 하나이며 조회와 생성과 해소가 모두 이 모양을 낸다
      required:
        - id
        - userId
        - jobId
        - taskId
        - kind
        - currentValue
        - proposedValue
        - rationale
        - status
        - error
        - createdAt
        - resolvedAt
      properties:
        id: { type: string }
        userId: { type: string }
        jobId: { type: string }
        taskId: { type: string }
        kind:
          $ref: "#/components/schemas/CleanupSuggestionKind"
        currentValue: { type: [string, "null"] }
        proposedValue: { type: [string, "null"] }
        rationale: { type: string }
        status:
          $ref: "#/components/schemas/CleanupSuggestionStatus"
        error: { type: [string, "null"] }
        createdAt:
          $ref: "#/components/schemas/Timestamp"
        resolvedAt:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"

    CleanupSuggestionList:
      type: object
      required: [suggestions]
      properties:
        suggestions:
          type: array
          description: 요청에 실린 순서를 그대로 지킨다
          items:
            $ref: "#/components/schemas/CleanupSuggestion"
