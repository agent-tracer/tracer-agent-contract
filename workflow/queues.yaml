meaning: >-
  작업 큐 셋과 그 위에서 도는 워크플로의 정본이다. 큐의 완전한 이름은 배포가 주는 접두사와
  여기 적힌 키를 하이픈으로 이어 만들며 계약은 접두사를 정하지 않는다. 나란히 띄워 비교할
  때만 배포가 접두사를 달리 주어 두 구현체가 서로 다른 큐를 본다.

naming:
  pattern: "{prefix}-{key}"
  prefixEnv: AGENT_TASK_QUEUE_PREFIX
  defaultPrefix: agent
  example: agent-chat

queues:
  chat:
    meaning: 대화 실행의 워크플로와 액티비티가 실행되는 큐다
    hostsWorkflows: true
  jobs:
    meaning: 잡의 워크플로와 짧은 액티비티가 실행되는 큐다
    hostsWorkflows: true
  generate:
    meaning: 최대 15분인 생성 액티비티가 짧은 액티비티의 슬롯을 점유하지 않도록 분리한 큐다
    hostsWorkflows: false
    note: >-
      이 큐를 폴링하는 워커는 액티비티만 등록한다. 워크플로를 여기 두면 그 워크플로는
      영원히 대기하므로 워크플로의 queue 는 chat 이나 jobs 여야 한다.

workflows:
  chatThread:
    name: chatThreadWorkflow
    queue: chat
    id: "chat-thread:{threadId}"
    signals:
      - name: enqueueChatExecution
        args: [executionId]
        meaning: >-
          접수가 새 실행 식별자를 스레드 워크플로에 밀어 넣는다. 인자는 대기 줄이 움직였다는
          포인터이며 스레드 워크플로는 그 값을 쓰지 않고 원장에서 다음 실행을 다시 조회한다.
    activities:
      - name: getNextChatExecution
        queue: chat
        startToCloseSeconds: 60
        maximumAttempts: 5
        meaning: 이 스레드에서 자기 축이 맡은 다음 대기 실행 하나를 원장에서 조회한다
    idleSeconds: 5
    maxChildren: 100

  chatExecution:
    name: chatExecutionWorkflow
    queue: chat
    id: "chat:{executionId}"
    activities:
      - name: prepareChatExecution
        queue: chat
        startToCloseSeconds: 120
        maximumAttempts: 5
      - name: generateChatExecution
        queue: chat
        startToCloseSeconds: 900
        heartbeatTimeoutSeconds: 30
        maximumAttempts: 3
      - name: finalizeChatExecution
        queue: chat
        startToCloseSeconds: 120
        maximumAttempts: 5
      - name: failChatExecution
        queue: chat
        startToCloseSeconds: 60
        maximumAttempts: 5

jobWorkflows:
  meaning: >-
    잡 하나를 태우는 워크플로다. 모델을 부르는 긴 생성은 generate 큐에서 돌고 짧은 준비와
    종결과 실패 처리는 jobs 큐에서 돈다. 워크플로를 잡 종류마다 두는지 하나로 받는지는
    구현체가 갖는 차이이며 conformance/cases/divergence.json이 그것을 적는다.

  perKind:
    titleSuggestion:
      name: titleSuggestionWorkflow
      queue: jobs
      id: "title.suggestion:{jobId}"
      activities:
        - name: prepareTitleSuggestion
          queue: jobs
          startToCloseSeconds: 60
          maximumAttempts: 5
        - name: generateTitleSuggestion
          queue: generate
          startToCloseSeconds: 300
          scheduleToCloseSeconds: 1200
          heartbeatTimeoutSeconds: 30
          maximumAttempts: 3
        - name: finalizeTitleSuggestion
          queue: jobs
          startToCloseSeconds: 60
          maximumAttempts: 5
        - name: markTitleJobFailed
          queue: jobs
          startToCloseSeconds: 60
          maximumAttempts: 5

    recipeScan:
      name: recipeScanWorkflow
      queue: jobs
      id: "recipe.scan:{jobId}"
      activities:
        - name: prepareRecipeScan
          queue: jobs
        - name: generateRecipeCandidates
          queue: generate
        - name: finalizeRecipeScan
          queue: jobs
        - name: markRecipeJobFailed
          queue: jobs

    taskCleanup:
      name: taskCleanupWorkflow
      queue: jobs
      id: "task.cleanup:{jobId}"
      activities:
        - name: prepareTaskCleanup
          queue: jobs
        - name: generateTaskCleanupSuggestions
          queue: generate
        - name: finalizeTaskCleanup
          queue: jobs
        - name: markCleanupJobFailed
          queue: jobs

  singleKind:
    agentJob:
      name: agentJobWorkflow
      queue: jobs
      id: "job:{kind}:{key}"
      kinds: [title-suggestion, recipe-scan, task-cleanup]
      idReusePolicy: REJECT_DUPLICATE
      activities:
        - name: prepareAgentJob
          queue: jobs
          startToCloseSeconds: 60
          maximumAttempts: 5
          meaning: 도메인 문맥을 모아 실행 입력에 싣고 원장을 실행 중으로 옮긴다
        - name: generateAgentJob
          queue: generate
          startToCloseSeconds: 900
          scheduleToCloseSeconds: 1200
          heartbeatTimeoutSeconds: 30
          heartbeatIntervalSeconds: 10
          maximumAttempts: 3
          meaning: 이 시도가 쓸 봉투를 받아 그래프를 돌리며 자격이 이 액티비티 밖으로 나가지 않는다
        - name: finalizeAgentJob
          queue: jobs
          startToCloseSeconds: 60
          maximumAttempts: 5
          meaning: 생성이 낸 결과를 원장에 종결로 적고 산출물과 완료를 배달한다
        - name: failAgentJob
          queue: jobs
          startToCloseSeconds: 60
          maximumAttempts: 5
          meaning: 어느 단계가 무너지든 원장이 그 실행을 실패로 닫는다
        - name: settleCanceledAgentJob
          queue: jobs
          startToCloseSeconds: 30
          meaning: 액티비티가 실행되기 전에 취소가 닿으면 워크플로가 원장을 직접 닫는다

leases:
  chatRunningMs: 1200000
  threadBusyRetryMs: 60000
  threadBusyMaxRounds: 45
  threadBusyFailure: chat.thread-busy
