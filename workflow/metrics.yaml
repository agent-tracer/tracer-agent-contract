meaning: >-
  워커가 여는 Temporal SDK 지표 창구의 정본이다. 두 구현체가 같은 포트를 열고 같은 단위로
  내야 하나의 패널과 하나의 임계값이 두 축을 함께 읽는다.

workerSdkMetrics:
  exporter: prometheus
  bindAddress: 0.0.0.0
  port: 9466
  path: /metrics
  durationUnit: seconds
  countersTotalSuffix: false
  unitSuffix: false
  scope: 워크플로나 액티비티를 등록하는 프로세스마다 하나를 열며 HTTP 표면만 여는 프로세스는 열지 않는다
  note: >-
    SDK 의 기본 단위는 밀리초이므로 초를 명시하지 않으면 schedule-to-start 를 읽는 패널과
    경보가 구현체마다 다른 값을 본다.
  nameNote: >-
    두 접미사가 지표의 이름을 빚으므로 값이 갈리면 패널의 질의가 한쪽 축을 찾지 못한다.
    두 SDK 의 기본값이 지금 같지만 그 기본에 기대면 어느 한쪽이 기본을 바꾸는 날
    조용히 갈리므로 두 구현체가 이 값을 명시로 넘긴다.

labels:
  meaning: >-
    지표에 실리는 축의 라벨이며 값의 목록은 OpenAPI 의 AgentAxis 가 소유한다. 같은 축이
    두 경로로 나가고 경로마다 이름의 규칙이 다르므로 두 이름을 나눠 적는다.
  axis:
    attributeKey: agent_tracer.backend
    labelName: agent_tracer_backend
    meaning: 그 지표를 낸 실행을 태운 축이다
    attributeKeyScope: >-
      OTLP 로 내보내는 계측이 쓰는 속성 이름이며 수집기가 점을 밑줄로 바꿔
      labelName 으로 만든다.
    labelNameScope: >-
      워커가 여는 지표 창구에 직접 싣는 이름이다. 이 창구는 수집기를 지나지 않고
      Prometheus 가 그대로 긁으므로 점이 든 이름은 본문 전체의 파싱을 실패시킨다.

executionMetrics:
  meaning: >-
    실행 하나가 예산을 어디에 썼고 무엇에 걸렸는지를 드러내는 지표다. 궤적은 무슨 일이
    있었는지를 실행 하나 단위로 남기고, 이 넷은 그것을 축과 에이전트 단위로 모아 프롬프트를
    고쳤을 때 비용이 어디로 갔는지를 사후에 읽게 한다.
  instruments:
    - name: agent.probe.budget.exhaustion_ratio
      kind: histogram
      unit: ratio
      labels: [agent, probe]
      records: 전문가 하나가 배분받은 몫 가운데 실제로 쓴 비율이며 1 에 가까울수록 그 축의 몫이 모자랐다는 뜻이다
    - name: agent.redispatch.rounds
      kind: histogram
      unit: rounds
      labels: [agent]
      records: 조율자가 종합 대신 전문가를 다시 부른 라운드 수이며 0 이 대부분이어야 정상이다
    - name: agent.validation.failure
      kind: counter
      unit: executions
      labels: [agent, repaired]
      records: 결정론 검증이 산출을 거절한 실행이며 repaired 가 그 뒤 수리가 살렸는지를 가른다
    - name: agent.model.landed
      kind: counter
      unit: executions
      labels: [agent]
      records: 예산이 다해 도구를 거두고 결론만 받은 실행이며 잦아지면 그 에이전트의 예산이 작다는 뜻이다
  note: >-
    라벨의 축 이름은 이 파일의 labels 절이 이미 소유하므로 여기에는 그 밖의 라벨만 적는다.
